# Org-shared composite — stand up an ephemeral PostgreSQL in CI with NO root,
# NO docker socket and NO apt. Consume it with:
#
#   uses: luminalityai/.github/.github/actions/setup-postgres@main
#     with:
#       version: "16"          # postgres major (pinned to production); resolves newest patch
#   # then, in any later step:
#   env: { DATABASE_URL: "${{ env.DATABASE_URL }}" }   # already exported to $GITHUB_ENV
#
# WHY THIS EXISTS
#   The jumpdrive-broker (`jdb`) runners execute each job inside an ephemeral,
#   rootless-podman container that is deliberately unprivileged:
#   `--security-opt no-new-privileges`, no docker API, no sudo. That means the
#   two usual ways to get a database in CI are BOTH unavailable there:
#     - `services:` containers   → need the docker/container API  → absent
#     - `apt-get install postgresql` / `sudo` → need root          → absent
#   So this action stands postgres up ENTIRELY in user space: it downloads a
#   relocatable postgres build (zonky's `embedded-postgres-binaries` from Maven
#   Central — per-OS/arch tarballs of a self-contained, relocatable server),
#   `initdb`s a throwaway cluster under $RUNNER_TEMP, and `pg_ctl start`s it as
#   the normal runner user (postgres refuses to run as root — the unprivileged
#   user is not a workaround here, it is the supported configuration).
#
#   It works UNCHANGED on GitHub-hosted `ubuntu-latest` too: nothing here is
#   jdb-specific — same download, same user-space cluster.
#
# NOTES
#   - zonky's linux tarballs ship ONLY the server trio (initdb/pg_ctl/postgres),
#     no psql/pg_isready/createdb. Readiness therefore uses `pg_ctl -w` (+ a TCP
#     probe), and an extra database is created via the single-user backend — no
#     client binary is required. Your app connects through libpq/its driver
#     using the exported DATABASE_URL, which needs no psql on the runner.
#   - Auth is `trust` on a throwaway cluster bound to 127.0.0.1 — correct for
#     disposable CI, never for anything that outlives the job.
#   - Mirror this file verbatim across the sibling org .github repos
#     (rarebit-one, sidekick-labs, fundbright, thesim-family). Fix bugs HERE and
#     propagate, so every consumer switches with a one-line `uses:` change.
name: "Setup PostgreSQL (root-free)"
description: >
  Stand up an ephemeral, relocatable PostgreSQL in CI with no root, no docker
  socket and no apt — works on unprivileged jumpdrive-broker (jdb) runners and
  on GitHub-hosted ubuntu-latest alike. Exports DATABASE_URL + PG* to the env.

inputs:
  version:
    description: >
      PostgreSQL major version (pinned to production = 16). A bare major ("16")
      or major.minor resolves to the newest matching patch on Maven Central; an
      exact "X.Y.Z" is used as-is.
    required: false
    default: "16"
  port:
    description: "TCP port to listen on (127.0.0.1)."
    required: false
    default: "5432"
  database:
    description: "Database to ensure exists (created if not the default)."
    required: false
    default: "postgres"
  username:
    description: "Superuser role to initialise the cluster with."
    required: false
    default: "postgres"

outputs:
  database-url:
    description: "postgresql:// URL for the running cluster (also exported to $GITHUB_ENV)."
    value: ${{ steps.up.outputs.database-url }}

runs:
  using: "composite"
  steps:
    - id: up
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_PORT: ${{ inputs.port }}
        INPUT_DATABASE: ${{ inputs.database }}
        INPUT_USERNAME: ${{ inputs.username }}
      run: |
        set -euo pipefail

        VERSION="${INPUT_VERSION:-16}"
        PORT="${INPUT_PORT:-5432}"
        DATABASE="${INPUT_DATABASE:-postgres}"
        USERNAME="${INPUT_USERNAME:-postgres}"

        : "${RUNNER_TEMP:?RUNNER_TEMP must be set}"
        WORK="$RUNNER_TEMP/setup-postgres"
        PGROOT="$WORK/dist"
        PGDATA="$WORK/data"
        LOGFILE="$WORK/postgres.log"
        mkdir -p "$WORK"

        # ── 1. Resolve OS/arch → zonky classifier ───────────────────────────
        os="$(uname -s)"; arch="$(uname -m)"
        if [ "$os" != "Linux" ]; then
          echo "::error::setup-postgres supports Linux runners only (got $os)"; exit 1
        fi
        case "$arch" in
          x86_64|amd64)  classifier="linux-amd64" ;;
          aarch64|arm64) classifier="linux-arm64v8" ;;
          *) echo "::error::unsupported arch '$arch'"; exit 1 ;;
        esac
        echo "runner: $os/$arch → zonky classifier $classifier"

        # ── 2. Resolve newest patch of the major (or use exact X.Y.Z) ───────
        META_BASE="https://repo1.maven.org/maven2/io/zonky/test/postgres/embedded-postgres-binaries-$classifier"
        if printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          resolved="$VERSION"
        else
          echo "resolving newest $VERSION.x from Maven Central metadata…"
          resolved="$(curl -fsSL --retry 3 --max-time 60 "$META_BASE/maven-metadata.xml" \
            | grep -oE "<version>${VERSION}\.[0-9]+\.[0-9]+</version>" \
            | sed -E 's/<[^>]+>//g' | sort -V | tail -1)"
        fi
        if [ -z "${resolved:-}" ]; then
          echo "::error::could not resolve a postgres version for major '$VERSION' ($classifier)"; exit 1
        fi
        echo "postgres version: $resolved"

        # ── 3. Download the zonky jar + verify its published SHA-1 ──────────
        JAR="embedded-postgres-binaries-$classifier-$resolved.jar"
        URL="$META_BASE/$resolved/$JAR"
        echo "downloading $URL"
        curl -fsSL --retry 3 --max-time 300 -o "$WORK/$JAR" "$URL"
        curl -fsSL --retry 3 --max-time 60 -o "$WORK/$JAR.sha1" "$URL.sha1"
        expected="$(tr -d '[:space:]' < "$WORK/$JAR.sha1")"
        actual="$(sha1sum "$WORK/$JAR" | awk '{print $1}')"
        if [ "$expected" != "$actual" ]; then
          echo "::error::SHA-1 mismatch for $JAR (expected $expected, got $actual)"; exit 1
        fi
        echo "sha1 verified: $actual"

        # ── 4. Extract: jar → inner .txz → relocatable postgres tree ────────
        rm -rf "$PGROOT"; mkdir -p "$PGROOT"
        unzip -o -q "$WORK/$JAR" '*.txz' -d "$WORK"
        txz="$(ls "$WORK"/*.txz | head -1)"
        tar -xf "$txz" -C "$PGROOT"       # GNU tar shells out to xz for .txz
        test -x "$PGROOT/bin/initdb" && test -x "$PGROOT/bin/pg_ctl" && test -x "$PGROOT/bin/postgres"
        export LD_LIBRARY_PATH="$PGROOT/lib:${LD_LIBRARY_PATH:-}"
        echo "postgres server version: $("$PGROOT/bin/postgres" --version)"

        # ── 5. initdb a throwaway cluster (trust auth, fixed superuser) ─────
        rm -rf "$PGDATA"; mkdir -p "$PGDATA"
        "$PGROOT/bin/initdb" -D "$PGDATA" \
          --username="$USERNAME" --auth=trust --auth-host=trust --auth-local=trust \
          --encoding=UTF8 --no-locale >/dev/null
        echo "initdb complete (superuser=$USERNAME)"

        # ── 6. Create the requested database up front if not the default ────
        #    zonky ships no psql/createdb → use the single-user backend.
        if [ "$DATABASE" != "postgres" ] && [ "$DATABASE" != "$USERNAME" ]; then
          echo "CREATE DATABASE \"$DATABASE\";" \
            | "$PGROOT/bin/postgres" --single -D "$PGDATA" postgres >/dev/null
          echo "created database $DATABASE"
        fi

        # ── 7. Start on $PORT (TCP 127.0.0.1) and wait for ready ────────────
        "$PGROOT/bin/pg_ctl" -D "$PGDATA" -l "$LOGFILE" -w -t 60 \
          -o "-p $PORT -c listen_addresses=127.0.0.1 -c unix_socket_directories=$WORK" \
          start
        for i in $(seq 1 30); do
          if (exec 3<>"/dev/tcp/127.0.0.1/$PORT") 2>/dev/null; then exec 3>&- 3<&-; break; fi
          sleep 1
        done
        "$PGROOT/bin/pg_ctl" -D "$PGDATA" status
        echo "postgres is accepting TCP connections on 127.0.0.1:$PORT"

        # ── 8. Export connection env + action output ────────────────────────
        DATABASE_URL="postgresql://$USERNAME@127.0.0.1:$PORT/$DATABASE"
        {
          echo "DATABASE_URL=$DATABASE_URL"
          echo "PGHOST=127.0.0.1"
          echo "PGPORT=$PORT"
          echo "PGUSER=$USERNAME"
          echo "PGDATABASE=$DATABASE"
        } >> "$GITHUB_ENV"
        echo "database-url=$DATABASE_URL" >> "$GITHUB_OUTPUT"
        echo "DATABASE_URL=$DATABASE_URL"
