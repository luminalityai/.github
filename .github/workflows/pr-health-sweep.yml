name: PR-health sweep

# Org-level companion to dependabot-sweep.yml, for the PRs that workflow cannot
# see. dependabot-sweep gates on `--author app/dependabot` and rebases via a
# `@dependabot rebase` comment; human- and agent-authored PRs hit the same two
# walls with nothing behind them:
#
#   1. Native auto-merge NEVER updates a branch, so on a strict "branches must be
#      up to date" repo an ARMED PR that falls BEHIND stalls forever — green,
#      mergeable, going nowhere.
#   2. A head commit can end up with NO check-runs at all, so the PR shows the
#      PREVIOUS commit's red X and nothing pending. One such fix sat correct and
#      invisible for six days in sidekick-labs, where this workflow originated.
#
# One cron for the whole org — not a per-repo workflow — to keep Actions minutes
# down, matching dependabot-sweep.yml's design. See scripts/pr-health-sweep.sh
# for the full rationale and the one-update-per-repo-per-pass pacing.
#
# This workflow never merges. Phase 1 hands a PR back to native auto-merge, which
# lands it once CI is green; Phases 2 and 3 are report-only.

on:
  schedule:
    - cron: '30 */6 * * *'   # offset 30min from dependabot-sweep (0 */6) so the two never race; no other cron in this org runs at :30
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Log decisions without updating any branch'
        type: boolean
        default: false
      stale-draft-days:
        description: 'Days a draft may sit untouched before it is reported'
        type: string
        default: '5'

permissions: {}

concurrency:
  group: pr-health-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep PR health
    # RUNNER, indirected so this org-internal beat can move to the homelab `jdb`
    # fleet WITHOUT editing this file. UNSET -> 'ubuntu-latest'.
    #   gh variable set    RUNNER_LABEL --body jdb --repo luminalityai/.github
    #   gh variable delete RUNNER_LABEL --repo luminalityai/.github   # instant revert
    # Precondition: the jumpdrive-broker runner group must admit luminalityai/.github
    # first -- otherwise the job queues forever with no red check.
    # ONE label, never a comma-separated list -- `runs-on:` reads a scalar as a
    # SINGLE label, so a comma value matches no runner and the job queues forever.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      issues: read # alert-job gate: look up an open beat-failure issue
      contents: read   # job token only checks out this repo; updates use the minted App token
    outputs:
      beat_issue_open: ${{ steps.beat.outputs.open }}
    steps:
      # Alert-job gate. `alert` below used to run on EVERY beat (a whole runner
      # spin-up, billed as a full minute) just to find nothing to do on a clean
      # run. It only has work when a needed job FAILED, or when a job succeeded
      # and a beat-failure issue is open to close. This step answers the second
      # question so `alert` can be skipped otherwise. Fail-safe: a lookup error
      # leaves the output unset / "true", so `alert` still runs, and `alert`
      # re-checks everything itself -- its behaviour is unchanged.
      - name: Look up an open beat-failure issue (alert-job gate)
        id: beat
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          N="$(gh issue list --search '"beat failure: pr-health-sweep" in:title' --state open --json number --jq '.[0].number // empty')" || N="lookup-failed"
          if [ -z "$N" ]; then echo "open=false" >> "$GITHUB_OUTPUT"; else echo "open=true" >> "$GITHUB_OUTPUT"; fi
      - name: Mint app token (contents + PRs write across the org)
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: luminalityai
          permission-contents: write
          permission-pull-requests: write
          # actions:read is REQUIRED, not optional. `repo_runs_ci` calls
          # repos/{repo}/actions/workflows to tell "this repo has no CI" apart
          # from "this repo's CI did not run". Without it that call 403s, the
          # count reads 0, every repo looks CI-less, and Phase 2 reports nothing
          # forever — the first live run in sidekick-labs did exactly that.
          permission-actions: read

      - name: Checkout (sweep script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Sweep
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ORG: luminalityai
          # schedule has no inputs → live; dispatch honours the dry-run toggle.
          DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}
          STALE_DRAFT_DAYS: ${{ inputs.stale-draft-days || '5' }}
        run: bash .github/scripts/pr-health-sweep.sh

  # Crash-heartbeat (house pattern, mirrors the actuator sweeps). The beat's own
  # fail-loud only helps if the job REACHED it. When a run dies earlier — token
  # mint, runner death, quota, `npm ci` — the missed beat would otherwise be
  # invisible: Slack narration is fail-soft, so a Slack outage swallows the signal
  # entirely and only a red run in the Actions tab remains. This lands the miss
  # somewhere durable instead. Dedupes into ONE open issue, and auto-closes it on
  # the next green run so a recovered beat doesn't leave litter.
  alert:
    needs: [sweep]
    # Runs only when there is something to do: a needed job failed (open or
    # comment the issue), or `sweep` saw an open beat-failure issue that a
    # success may close. `!= 'false'` so a missing/failed lookup still runs it.
    if: ${{ always() && (contains(needs.*.result, 'failure') || needs.sweep.outputs.beat_issue_open != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Flag failure or clear on recovery
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # this job has no checkout, so pin the repo for gh
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          SUCCEEDED: ${{ contains(needs.*.result, 'success') }}
        run: |
          set -euo pipefail
          WF="pr-health-sweep"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING="$(gh issue list --search "\"beat failure: ${WF}\" in:title" --state open --json number --jq '.[0].number // empty')"
          if [ "${FAILED}" != "true" ]; then
            # Nothing failed. Close any open failure issue only on a run that actually
            # succeeded — an all-skipped run is not evidence of recovery.
            if [ "${SUCCEEDED}" = "true" ] && [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --comment "Recovered: ${WF} succeeded — ${RUN_URL}."
            fi
            exit 0
          fi
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Failed again: ${RUN_URL}"
          else
            gh issue create \
              --title "beat failure: ${WF} ($(date -u +%F))" \
              --body "The \`${WF}\` beat failed before it could report — see ${RUN_URL}"
          fi
