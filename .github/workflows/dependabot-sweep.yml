name: Dependabot sweep

# Org-level, single-pass auto-lander that COMPLEMENTS the per-PR
# dependabot-auto-merge.yml. The per-PR workflow approves minor/patch bumps and
# arms GitHub native auto-merge (which lands a CLEAN PR for free). This sweep
# only mops up the tail native auto-merge can't: PRs that fall BEHIND on
# strict-protected repos (native auto-merge never updates a branch). One cron for
# the whole org — not a per-repo workflow — to keep Actions minutes down.
#
# Phase 1 merges ready (CLEAN, already-approved) dependabot PRs; Phase 2 rebases
# exactly ONE behind PR per repo per pass (O(N) CI, not the O(N^2) you get from
# rebasing the whole stack). Majors are skipped (the per-PR gate never approves
# them, and this only acts on APPROVED PRs). See scripts/dependabot-sweep.sh.

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6h — drains BEHIND stragglers ~4x/day
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Log decisions without merging/rebasing'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: dependabot-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep dependabot PRs
    # RUNNER -- HOSTED unless RUNNER_LABELS_LINUX is set on this repo.
    # 🔴 NEVER a bare `jdb`. A bare `runs-on: jdb` job can be taken by the macOS
    # runner the broker mints for `[jdb, macos]` iOS jobs -- GitHub matches a job
    # to ANY runner whose labels are a superset of its own (delivery-ops#420).
    # Opt in with a JSON ARRAY that names the OS, e.g. '["jdb","linux"]': `linux`
    # makes the broker require a Linux worker and is minted into the runner's
    # labels, so a macOS runner can never take the job. fromJSON of the quoted
    # fallback is the plain string 'ubuntu-latest'.
    # Precondition: the jumpdrive-broker runner group must admit luminalityai/.github
    # first -- otherwise the job queues forever with no red check.
    #   gh variable set    RUNNER_LABELS_LINUX --body '["jdb","linux"]' --repo luminalityai/.github
    #   gh variable delete RUNNER_LABELS_LINUX --repo luminalityai/.github   # instant revert
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 15
    permissions:
      issues: read # alert-job gate: look up an open beat-failure issue
      contents: read   # job token only checks out this repo; merges/rebases use the minted App token
    outputs:
      beat_issue_open: ${{ steps.beat.outputs.open }}
    steps:
      # Alert-job gate. `alert` below used to run on EVERY beat (a whole runner
      # spin-up, billed as a full minute) just to find nothing to do on a clean
      # run. It only has work when a needed job FAILED, or when a job succeeded
      # and a beat-failure issue is open to close. This step answers the second
      # question so `alert` can be skipped otherwise. Fail-safe: a lookup error
      # leaves the output unset / "true", so `alert` still runs, and `alert`
      # re-checks everything itself -- its behaviour is unchanged.
      - name: Look up an open beat-failure issue (alert-job gate)
        id: beat
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          N="$(gh issue list --search '"beat failure: dependabot-sweep" in:title' --state open --json number --jq '.[0].number // empty')" || N="lookup-failed"
          if [ -z "$N" ]; then echo "open=false" >> "$GITHUB_OUTPUT"; else echo "open=true" >> "$GITHUB_OUTPUT"; fi
      - name: Mint app token (contents + PRs write across the org)
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: luminalityai
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout (sweep script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Sweep
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ORG: luminalityai
          # schedule has no inputs → live; dispatch honours the dry-run toggle.
          DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}
        run: bash .github/scripts/dependabot-sweep.sh

  # Crash-heartbeat (house pattern, mirrors the actuator sweeps). The beat's own
  # fail-loud only helps if the job REACHED it. When a run dies earlier — token
  # mint, runner death, quota, `npm ci` — the missed beat would otherwise be
  # invisible: Slack narration is fail-soft, so a Slack outage swallows the signal
  # entirely and only a red run in the Actions tab remains. This lands the miss
  # somewhere durable instead. Dedupes into ONE open issue, and auto-closes it on
  # the next green run so a recovered beat doesn't leave litter.
  alert:
    needs: [sweep]
    # Runs only when there is something to do: a needed job failed (open or
    # comment the issue), or `sweep` saw an open beat-failure issue that a
    # success may close. `!= 'false'` so a missing/failed lookup still runs it.
    if: ${{ always() && (contains(needs.*.result, 'failure') || needs.sweep.outputs.beat_issue_open != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Flag failure or clear on recovery
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # this job has no checkout, so pin the repo for gh
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          SUCCEEDED: ${{ contains(needs.*.result, 'success') }}
        run: |
          set -euo pipefail
          WF="dependabot-sweep"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING="$(gh issue list --search "\"beat failure: ${WF}\" in:title" --state open --json number --jq '.[0].number // empty')"
          if [ "${FAILED}" != "true" ]; then
            # Nothing failed. Close any open failure issue only on a run that actually
            # succeeded — an all-skipped run is not evidence of recovery.
            if [ "${SUCCEEDED}" = "true" ] && [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --comment "Recovered: ${WF} succeeded — ${RUN_URL}."
            fi
            exit 0
          fi
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Failed again: ${RUN_URL}"
          else
            gh issue create \
              --title "beat failure: ${WF} ($(date -u +%F))" \
              --body "The \`${WF}\` beat failed before it could report — see ${RUN_URL}"
          fi
