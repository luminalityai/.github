name: Promote to Production

on:
  workflow_call:
    inputs:
      sentry_org:
        required: true
        type: string
      sentry_project:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false
      ref:
        required: false
        type: string
        default: ""

# Never cancel an in-progress promotion
concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  promote:
    name: Promote to Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ inputs.sentry_org }}
      SENTRY_PROJECT: ${{ inputs.sentry_project }}

    steps:
      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine target SHA
        id: main
        run: |
          REF="${{ inputs.ref }}"
          if [ -n "$REF" ]; then
            if ! git rev-parse --verify "$REF" &>/dev/null; then
              echo "::error::Ref '$REF' is not a valid commit"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$REF" HEAD; then
              echo "::error::Ref '$REF' is not an ancestor of main — can only promote commits on main"
              exit 1
            fi
            SHA=$(git rev-parse "$REF")
            echo "Promoting up to specified ref: $SHA"
          else
            SHA=$(git rev-parse HEAD)
            echo "Promoting main HEAD: $SHA"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Verify CI passed on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ steps.main.outputs.sha }}"
          echo "Checking CI status for $SHA"

          CONCLUSION=""
          for i in 1 2 3; do
            CONCLUSION=$(gh run list \
              --workflow=ci.yml \
              --branch=main \
              --json headSha,conclusion \
              --jq ".[] | select(.headSha == \"$SHA\") | .conclusion" \
              | head -1)
            if [ -n "$CONCLUSION" ]; then
              break
            fi
            echo "CI run not found yet, retrying in 10s... (attempt $i/3)"
            sleep 10
          done

          if [ -z "$CONCLUSION" ]; then
            echo "::error::No CI run found for SHA $SHA"
            exit 1
          fi

          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI status is '$CONCLUSION' (expected 'success') for SHA $SHA"
            exit 1
          fi

          echo "CI passed for $SHA"

      - name: Check production branch state
        id: check
        run: |
          SHA="${{ steps.main.outputs.sha }}"

          if ! git rev-parse --verify origin/production &>/dev/null; then
            echo "::error::production branch does not exist — create it first"
            exit 1
          fi

          PROD_SHA=$(git rev-parse origin/production)
          echo "prod_sha=$PROD_SHA" >> "$GITHUB_OUTPUT"

          if [ "$SHA" = "$PROD_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::production branch is already at $SHA — nothing to promote"
            exit 0
          fi

          if ! git merge-base --is-ancestor origin/production "$SHA"; then
            echo "::error::production branch has diverged from target — manual resolution required"
            exit 1
          fi

          COMMIT_COUNT=$(git rev-list origin/production.."$SHA" --count)
          echo "commit_count=$COMMIT_COUNT" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Promoting $COMMIT_COUNT commit(s) to production"

      - name: Preflight — verify write access to production
        # Validates the token can fast-forward `production` WITHOUT mutating it,
        # so a missing `permissions: contents: write` in the caller fails here
        # with a clear message instead of a raw 403 mid-promote. Runs in dry-run
        # too, which makes `--dry-run` a genuine smoke test of release perms.
        if: steps.check.outputs.skip != 'true'
        run: |
          SHA="${{ steps.main.outputs.sha }}"
          if ! git push --dry-run origin "${SHA}:refs/heads/production" 2>push.err; then
            echo "::error::Cannot push to 'production' — the calling workflow must grant 'permissions: contents: write'. Details: $(tr '\n' ' ' < push.err)"
            exit 1
          fi
          echo "Write access to production confirmed (dry-run push OK)"

      - name: Generate release tag
        if: steps.check.outputs.skip != 'true'
        id: tag
        run: |
          TODAY=$(date -u +%Y.%m.%d)
          PREFIX="v${TODAY}"

          EXISTING=$(git tag -l "${PREFIX}.*" | sort -t. -k4 -n | tail -1)
          if [ -n "$EXISTING" ]; then
            LAST_N=$(echo "$EXISTING" | rev | cut -d. -f1 | rev)
            NEXT_N=$((LAST_N + 1))
          else
            NEXT_N=1
          fi

          TAG="${PREFIX}.${NEXT_N}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Generated tag: $TAG"

      - name: Write deploy summary
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ steps.main.outputs.sha }}"
          TAG="${{ steps.tag.outputs.tag }}"
          DRY_RUN="${{ inputs.dry_run }}"

          {
            echo "## Production Promotion"
            echo ""
            if [ "$DRY_RUN" = "true" ]; then
              echo "> **DRY RUN** — no changes will be promoted"
              echo ""
            fi
            echo "**Tag:** \`$TAG\`"
            echo "**SHA:** \`$SHA\`"
            echo "**Commits:** ${{ steps.check.outputs.commit_count }}"
            echo ""
            echo "### Commits"
            echo ""
            git log origin/production.."$SHA" --format="- %h %s" --reverse
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Promote main to production branch
        id: promote
        if: steps.check.outputs.skip != 'true' && inputs.dry_run != true
        run: |
          SHA="${{ steps.main.outputs.sha }}"
          git push origin "${SHA}:refs/heads/production"

          git fetch origin production
          PUSHED_SHA=$(git rev-parse origin/production)
          if [ "$PUSHED_SHA" != "$SHA" ]; then
            echo "::error::Production branch promotion failed — expected $SHA, got $PUSHED_SHA"
            exit 1
          fi

          echo "Promoted production branch to $SHA"

      - name: Create release tag
        # Fail-soft: the promote already succeeded by here. A tag hiccup must
        # never abort the run (and so skip the Release/Sentry steps) — surface a
        # warning and continue. Idempotent so re-runs don't error on an existing tag.
        continue-on-error: true
        if: steps.check.outputs.skip != 'true' && inputs.dry_run != true
        run: |
          SHA="${{ steps.main.outputs.sha }}"
          TAG="${{ steps.tag.outputs.tag }}"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" &>/dev/null; then
            echo "::notice::Tag $TAG already exists on origin — skipping"
            exit 0
          fi

          # Annotated tags record a tagger identity; the runner has none by
          # default, so `git tag -a` fails with "empty ident name". Set one.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" "$SHA" -m "Production release $TAG"
          git push origin "$TAG"
          echo "Created and pushed tag $TAG"

      - name: Create GitHub Release
        # Fail-soft (bookkeeping; promote already done).
        continue-on-error: true
        if: steps.check.outputs.skip != 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ steps.main.outputs.sha }}"
          TAG="${{ steps.tag.outputs.tag }}"
          PREV_SHA="${{ steps.check.outputs.prod_sha }}"

          COMMIT_COUNT=$(git rev-list ${PREV_SHA}..${SHA} --count)
          NOTES=$(git log ${PREV_SHA}..${SHA} --format="- %h %s (%an)" --reverse | head -50)

          if [ "$COMMIT_COUNT" -gt 50 ]; then
            NOTES="$NOTES"$'\n'"_($((COMMIT_COUNT - 50)) more commits not shown)_"
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$NOTES" \
            --target "$SHA"

          echo "Created GitHub Release $TAG"

      - name: Notify Sentry of production deploy
        continue-on-error: true
        if: steps.check.outputs.skip != 'true' && inputs.dry_run != true
        run: |
          SHA="${{ steps.main.outputs.sha }}"

          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN not configured — skipping Sentry deploy notification"
            exit 0
          fi

          npm install -g @sentry/cli

          sentry-cli releases new "$SHA" 2>/dev/null || true

          if sentry-cli releases deploys "$SHA" new \
            -e production \
            --name "${{ steps.tag.outputs.tag }}"; then
            echo "Recorded Sentry deploy for release $SHA in production environment"
          else
            echo "::warning::Failed to notify Sentry of deploy — deployment itself succeeded"
          fi

      # ── Threaded Slack narration ───────────────────────────────────────
      # Two-beat lifecycle via the shared slack-deploy-thread composite: a
      # thread ROOT ("release started", `mode: start`) posted on always() the
      # moment a real release is attempted (so it covers a FAILED promote too),
      # then a single OUTCOME reply (`mode: reply`) into that thread reporting
      # ✅ promoted / 🔴 failed. There's deliberately no "live & healthy" beat — this
      # caller (luminality-web) is minimal and has no post-deploy smoke probe
      # to hook one onto (unlike fundbright-web), so the honest outcome is
      # "promoted, DigitalOcean is rolling it out" / a failure note based on
      # the promote step's result. The composite soft-degrades on every path
      # (missing token/channel → no-op; API hiccup → ::warning::, ok=false),
      # so the promotion itself never depends on Slack being wired up — same
      # fail-soft posture as the inline curl this replaces.
      - name: Compose release-started thread root
        id: slack_root_text
        # always() (still gated on a real, non-dry-run release) so the thread root
        # posts even when the promote step fails — that's what lets the outcome
        # reply below thread a 🔴 failure under it instead of stranding nothing.
        if: always() && steps.check.outputs.skip != 'true' && inputs.dry_run != true
        env:
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          SHA: ${{ steps.main.outputs.sha }}
          TAG: ${{ steps.tag.outputs.tag }}
          COMMIT_COUNT: ${{ steps.check.outputs.commit_count }}
        run: |
          set -uo pipefail
          SHORT_SHA="${SHA:0:9}"
          RELEASE_URL="${SERVER_URL}/${REPO}/releases/tag/${TAG}"
          # mrkdwn, one fact per line (the org's slack-post discipline). Passed
          # verbatim to the composite as `text` — it handles JSON-safety.
          {
            echo "text<<SLACK_EOF"
            printf '%s\n' \
              "🚀 *Production release started* — \`${REPO}\`" \
              "*Tag:* <${RELEASE_URL}|${TAG}>" \
              "*Commit:* \`${SHORT_SHA}\` (${COMMIT_COUNT} commit(s))" \
              "*Status:* promoting \`main\` to the \`production\` branch…"
            echo "SLACK_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post release thread root
        id: slack_root
        if: always() && steps.check.outputs.skip != 'true' && inputs.dry_run != true
        continue-on-error: true
        uses: luminalityai/.github/.github/actions/slack-deploy-thread@main
        with:
          bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
          mode: start
          text: ${{ steps.slack_root_text.outputs.text }}

      - name: Compose release-outcome reply
        id: slack_outcome_text
        # Mirrors Final summary's logic, but as a thread reply. Gated on a real
        # thread root (empty when Slack is unconfigured / the root post failed),
        # so it never strands a top-level message. Runs on always() so a failed
        # promote still threads the bad news under the same root.
        if: always() && steps.slack_root.outputs.thread_ts != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PROMOTE_OUTCOME: ${{ steps.promote.outcome }}
        run: |
          set -uo pipefail
          if [ "$PROMOTE_OUTCOME" = "success" ]; then
            TEXT="✅ *Promoted to \`production\`* (\`${TAG}\`) — DigitalOcean is rolling it out."
          else
            TEXT="❌ *Promotion did NOT complete* — promote step outcome: \`${PROMOTE_OUTCOME:-did-not-run}\`. \`production\` was NOT advanced."
          fi
          {
            echo "text<<SLACK_EOF"
            printf '%s\n' "$TEXT"
            echo "SLACK_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post release outcome into the thread
        if: always() && steps.slack_root.outputs.thread_ts != ''
        continue-on-error: true
        uses: luminalityai/.github/.github/actions/slack-deploy-thread@main
        with:
          bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
          mode: reply
          thread_ts: ${{ steps.slack_root.outputs.thread_ts }}
          text: ${{ steps.slack_outcome_text.outputs.text }}

      - name: Final summary
        if: always()
        run: |
          SHA="${{ steps.main.outputs.sha }}"
          TAG="${{ steps.tag.outputs.tag }}"
          SKIP="${{ steps.check.outputs.skip }}"
          DRY_RUN="${{ inputs.dry_run }}"

          PROMOTE_OUTCOME="${{ steps.promote.outcome }}"

          if [ "$SKIP" = "true" ]; then
            echo "::notice::No-op — production is already at main ($SHA)"
          elif [ "$DRY_RUN" = "true" ]; then
            echo "::notice::Dry run complete — would have promoted $TAG ($SHA)"
          elif [ "$PROMOTE_OUTCOME" = "success" ]; then
            # Only claim success once the promote push actually landed — never
            # announce "Promoted" off the back of always() when the push failed.
            echo "::notice::Promoted $TAG ($SHA) to production"
          else
            echo "::error::Promotion did NOT complete — promote step outcome: '${PROMOTE_OUTCOME:-did-not-run}'. production was NOT advanced."
          fi
